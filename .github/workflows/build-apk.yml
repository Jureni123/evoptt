name: Build Mumla-OLED APK

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0  # Penting: Fetch semua history agar submodule resolve benar

      - name: Verify & Update Submodules
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive --force
          # Verifikasi file kritis RNNoise ada
          ls -la libraries/humla/src/main/jni/rnnoise/
          if [ ! -f "libraries/humla/src/main/jni/rnnoise/model_version" ]; then
            echo "ERROR: model_version tidak ditemukan! Mencoba fix manual..."
            # Kadang submodule perlu di-reset hard
            cd libraries/humla/src/main/jni/rnnoise
            git checkout HEAD -- .
            cd ../../../../../..
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Android SDK & NDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 12266719
          accept-android-sdk-licenses: true
          packages: platform-tools platforms;android-36 build-tools;36.0.0 ndk;27.2.12479018

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build FOSS Debug APK
        run: ./gradlew assembleFossDebug --stacktrace

      - name: Upload FOSS Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mumla-oled-foss-debug-apk
          path: app/build/outputs/apk/foss/debug/mumla-foss-debug.apk
