name: Build Mumla-OLED APK

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          ndk-version: '27.2.12479018'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build FOSS Debug APK
        run: ./gradlew assembleFossDebug --stacktrace

      - name: Upload FOSS Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mumla-oled-foss-debug-apk
          path: app/build/outputs/apk/foss/debug/mumla-foss-debug.apk
