name: Build Mumla-OLED APK (Manual)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ambil Info Commit
        id: commit-info
        shell: bash
        run: |
          SHORT_HASH=$(git rev-parse --short=7 HEAD)
          echo "SHORT=$SHORT_HASH" >> $GITHUB_OUTPUT

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Android SDK & NDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 12266719
          accept-android-sdk-licenses: true
          packages: platform-tools platforms;android-36 build-tools;36.0.0 ndk;27.2.12479018

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build FOSS Debug APK
        run: ./gradlew assembleFossDebug --stacktrace

      - name: Rename APK with Commit Hash
        shell: bash
        run: |
          SHORT="${{ steps.commit-info.outputs.SHORT }}"
          SRC="app/build/outputs/apk/foss/debug/mumla-foss-debug.apk"
          DST="app/build/outputs/apk/foss/debug/mumla-oled-${SHORT}.apk"
          if [ -f "$SRC" ]; then
            cp "$SRC" "$DST"
            echo "✅ APK siap: $DST"
          else
            echo "❌ APK tidak ditemukan!"
            exit 1
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mumla-oled-${{ steps.commit-info.outputs.SHORT }}
          path: app/build/outputs/apk/foss/debug/mumla-oled-*.apk
