name: Build Mumla-OLED APK

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Ambil Kode Commit
        id: commit-info
        shell: bash
        run: |
          SHORT_HASH=$(git rev-parse --short=7 HEAD)
          FULL_HASH=$(git rev-parse HEAD)
          echo "SHORT=$SHORT_HASH" >> $GITHUB_OUTPUT
          echo "FULL=$FULL_HASH" >> $GITHUB_OUTPUT
          echo "COMMIT_MSG=$(git log -1 --oneline)" >> $GITHUB_OUTPUT

      - name: Verify & Update Submodules
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive --force
          ls -la libraries/humla/src/main/jni/rnnoise/

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Android SDK & NDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 12266719
          accept-android-sdk-licenses: true
          packages: platform-tools platforms;android-36 build-tools;36.0.0 ndk;27.2.12479018

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build FOSS Debug APK
        run: ./gradlew assembleFossDebug --stacktrace

      - name: Salin APK dengan Nama Commit
        shell: bash
        run: |
          SHORT="${{ steps.commit-info.outputs.SHORT }}"
          SRC="app/build/outputs/apk/foss/debug/mumla-foss-debug.apk"
          DST="app/build/outputs/apk/foss/debug/mumla-oled-${SHORT}.apk"
          cp "$SRC" "$DST"
          echo "✅ APK: $DST"
          echo "📝 Commit: ${{ steps.commit-info.outputs.COMMIT_MSG }}"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mumla-oled-${{ steps.commit-info.outputs.SHORT }}
          path: app/build/outputs/apk/foss/debug/mumla-oled-*.apk
